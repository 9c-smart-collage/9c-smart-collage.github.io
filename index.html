<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>9C Smart College - Official Portal</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
body{background:#0f172a}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-thumb{background:#334155;border-radius:10px}
</style>
</head>
<body class="text-white min-h-screen">
<!-- NAV -->
<nav class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50">
<div class="max-w-6xl mx-auto flex justify-between items-center">
<h1 class="font-bold text-xl"><i class="fa-solid fa-graduation-cap text-purple-500"></i> 9C Smart College</h1>
<div class="flex gap-3">
<button onclick="showTab('home')" class="px-4 py-2 bg-slate-800 rounded-lg hover:bg-slate-700 text-sm">Home</button>
<button onclick="showTab('quizzes')" class="px-4 py-2 bg-slate-800 rounded-lg hover:bg-slate-700 text-sm">Quizzes</button>
<button onclick="showTab('ai')" class="px-4 py-2 bg-purple-600 rounded-lg hover:bg-purple-700 text-sm"><i class="fa-solid fa-robot"></i> AI Tutor</button>
<button id="adminBtn" onclick="showTab('admin')" class="hidden px-4 py-2 bg-amber-600 rounded-lg text-sm">Admin</button>
<button onclick="document.getElementById('pinModal').classList.remove('hidden')" class="px-3 py-2 bg-slate-800 rounded-lg text-sm"><i class="fa-solid fa-lock"></i></button>
</div>
</div>
</nav>

<div class="max-w-6xl mx-auto p-4 md:p-6">
<!-- HOME TAB -->
<div id="tab-home">
<div class="bg-gradient-to-r from-purple-600 to-blue-600 p-8 rounded-2xl mb-6">
<h2 class="text-3xl font-bold mb-2">Welcome to 9C Portal</h2>
<p class="text-purple-100">All lessons, homework & announcements live synced to all students phones.</p>
<div class="mt-3 text-xs bg-black/20 inline-block px-3 py-1 rounded-full"><span id="syncStatus">● Connecting live sync...</span></div>
</div>
<div id="contentContainer" class="grid gap-4"></div>
</div>

<!-- QUIZZES TAB -->
<div id="tab-quizzes" class="hidden">
<h2 class="text-2xl font-bold mb-4"><i class="fa-solid fa-brain text-purple-500"></i> Live Quizzes</h2>
<div id="quizzesContainer" class="grid md:grid-cols-2 gap-4"></div>
<div id="quizPlayer" class="hidden bg-slate-900 p-6 rounded-2xl border border-slate-800"></div>
</div>

<!-- AI TAB -->
<div id="tab-ai" class="hidden">
<div class="bg-slate-900 rounded-2xl border border-slate-800 flex flex-col h-[70vh]">
<div class="p-4 border-b border-slate-800 font-bold"><i class="fa-solid fa-robot text-purple-500"></i> 9C AI Tutor - Real Gemini AI</div>
<div id="aiChatMessages" class="flex-1 overflow-y-auto p-4 space-y-4">
<div class="flex gap-3"><div class="w-8 h-8 bg-purple-600 rounded-full flex items-center justify-center shrink-0"><i class="fa-solid fa-robot text-xs"></i></div><div class="bg-slate-800 p-3 rounded-2xl rounded-tl-none text-sm">Hi! I'm your real AI tutor. Ask me any Math, Science, English question!</div></div>
</div>
<form onsubmit="handleAiChat(event)" class="p-4 border-t border-slate-800 flex gap-2">
<input id="aiChatInput" placeholder="Ask anything..." class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm outline-none focus:border-purple-500">
<button class="bg-purple-600 hover:bg-purple-700 px-6 py-3 rounded-xl text-sm font-bold">Send</button>
</form>
</div>
</div>

<!-- ADMIN TAB -->
<div id="tab-admin" class="hidden">
<div id="adminPanel"></div>
</div>
</div>

<!-- PIN MODAL -->
<div id="pinModal" class="fixed inset-0 bg-black/80 hidden flex items-center justify-center z-[100] p-4">
<div class="bg-slate-900 p-8 rounded-2xl border border-slate-800 w-full max-w-sm">
<h3 class="font-bold text-lg mb-4">Admin Login</h3>
<input id="pinInput" type="password" placeholder="Enter PIN" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 mb-3 outline-none">
<button onclick="checkPin()" class="w-full bg-purple-600 hover:bg-purple-700 py-3 rounded-xl font-bold">Login</button>
<button onclick="document.getElementById('pinModal').classList.add('hidden')" class="w-full mt-2 text-slate-400 text-sm">Close</button>
</div>
</div>

<!-- ADD MODAL -->
<div id="addModal" class="fixed inset-0 bg-black/80 hidden flex items-center justify-center z-[100] p-4">
<div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 w-full max-w-lg">
<h3 class="font-bold mb-4">Add Content</h3>
<select id="addType" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 mb-3"><option>Lesson</option><option>Homework</option><option>Announcement</option></select>
<select id="addSubject" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 mb-3"><option>Math</option><option>Science</option><option>English</option><option>History</option><option>General</option></select>
<input id="addTitle" placeholder="Title" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 mb-3">
<textarea id="addDesc" placeholder="Description / Content" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 mb-3 h-24"></textarea>
<div class="flex gap-2">
<button onclick="handleAdd()" class="flex-1 bg-purple-600 py-3 rounded-xl font-bold">Publish LIVE</button>
<button onclick="document.getElementById('addModal').classList.add('hidden')" class="flex-1 bg-slate-800 py-3 rounded-xl">Cancel</button>
</div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDjY7W0lNitZjvwvum59NLvgQGDJPF4FP4",
  authDomain: "c-smart-9c.firebaseapp.com",
  projectId: "c-smart-9c",
  storageBucket: "c-smart-9c.appspot.com",
  messagingSenderId: "YOUR_ID",
  appId: "YOUR_APP_ID"
};

let app, db;
try {
  app = initializeApp(firebaseConfig);
  db = getFirestore(app);
  window.db = db;
} catch(e){ console.log("Firebase offline mode", e); }

window.contents = JSON.parse(localStorage.getItem('contents') || '[]');
window.quizzes = JSON.parse(localStorage.getItem('quizzes') || '[]');
window.currentUser = localStorage.getItem('isAdmin') === 'true';
window.currentQuizQuestions = [];

window.showTab = function(tab){
  document.getElementById('tab-home').classList.add('hidden');
  document.getElementById('tab-quizzes').classList.add('hidden');
  document.getElementById('tab-ai').classList.add('hidden');
  document.getElementById('tab-admin').classList.add('hidden');
  document.getElementById('tab-'+tab).classList.remove('hidden');
  if(tab==='home') renderContent();
  if(tab==='quizzes') renderQuizzesForStudents();
  if(tab==='admin') renderAdminPanel();
}

window.renderContent = function(){
  const c = document.getElementById('contentContainer');
  if(window.contents.length===0){ c.innerHTML='<div class="text-center py-20 text-slate-500">No content yet. Admin can add lessons.</div>'; return; }
  c.innerHTML = window.contents.map(item=>`
    <div class="bg-slate-900 p-5 rounded-xl border border-slate-800">
      <div class="flex justify-between items-start mb-2"><span class="text-xs px-2 py-1 rounded-full bg-purple-600/20 text-purple-300">${item.type} • ${item.subject}</span><span class="text-xs text-slate-500">${new Date(item.date).toLocaleDateString()}</span></div>
      <h3 class="font-bold text-lg">${item.title}</h3><p class="text-slate-300 text-sm mt-2 whitespace-pre-wrap">${item.desc}</p>
    </div>
  `).join('');
}

window.checkPin = function(){
  const pin = document.getElementById('pinInput').value;
  if(pin==="1234" || pin==="9c2025"){
    localStorage.setItem('isAdmin','true'); window.currentUser=true;
    document.getElementById('pinModal').classList.add('hidden');
    document.getElementById('adminBtn').classList.remove('hidden');
    applyLoginState(); showTab('admin');
  } else alert("Wrong PIN. Try 1234");
}

window.applyLoginState = function(){
  if(window.currentUser){ document.getElementById('adminBtn').classList.remove('hidden'); }
}

window.openAddModal = function(){ document.getElementById('addModal').classList.remove('hidden'); }

window.handleAdd = async function(){
  const type = document.getElementById('addType').value;
  const subject = document.getElementById('addSubject').value;
  const title = document.getElementById('addTitle').value.trim();
  const desc = document.getElementById('addDesc').value.trim();
  if(!title) return alert('Add title');
  const newItem = { id: Date.now(), type, subject, title, desc, date: new Date().toISOString() };
  window.contents.unshift(newItem);
  localStorage.setItem('contents', JSON.stringify(window.contents));
  if(window.db){
    try{ await setDoc(doc(window.db, "portal", "contents"), { data: window.contents }); }catch(e){}
  }
  document.getElementById('addModal').classList.add('hidden');
  document.getElementById('addTitle').value=''; document.getElementById('addDesc').value='';
  renderContent(); alert('Published LIVE to all phones!');
}

window.initCloudSync = function(){
  if(!window.db){ document.getElementById('syncStatus').textContent='● Offline mode (local only)'; return; }
  document.getElementById('syncStatus').textContent='● Live sync active - all phones connected';
  try{
    onSnapshot(doc(window.db, "portal", "contents"), (snap)=>{
      if(snap.exists()){ window.contents = snap.data().data; localStorage.setItem('contents', JSON.stringify(window.contents)); renderContent(); }
    });
    onSnapshot(doc(window.db, "portal", "quizzes"), (snap)=>{
      if(snap.exists()){ window.quizzes = snap.data().data; localStorage.setItem('quizzes', JSON.stringify(window.quizzes)); renderQuizzesForStudents(); renderAdminQuizzesList(); }
    });
  }catch(e){ console.log(e); }
}

// QUIZ SYSTEM
window.renderQuizzesForStudents = function(){
  const container = document.getElementById('quizzesContainer');
  if(!container) return;
  if(window.quizzes.length===0){ container.innerHTML='<p class="text-slate-500 text-center py-10">No quizzes yet</p>'; return; }
  container.innerHTML = window.quizzes.map(q=>`<div class="bg-slate-900 p-5 rounded-xl border border-slate-800 hover:border-purple-500/50"><h4 class="font-bold">${q.title}</h4><p class="text-slate-400 text-sm">${q.subject} • ${q.questions.length} Qs</p><button onclick="startQuiz(${q.id})" class="mt-3 bg-purple-600 text-white px-4 py-2 rounded-lg text-sm w-full">Take Quiz</button></div>`).join('');
}

window.startQuiz = function(id){
  const quiz = window.quizzes.find(q=>q.id===id); if(!quiz) return;
  let score=0, idx=0;
  const player = document.getElementById('quizPlayer');
  player.classList.remove('hidden'); document.getElementById('quizzesContainer').classList.add('hidden');
  function showQ(){
    if(idx>=quiz.questions.length){
      player.innerHTML=`<h3 class="text-2xl font-bold text-center">Done! Score ${score}/${quiz.questions.length}</h3><button onclick="document.getElementById('quizPlayer').classList.add('hidden');document.getElementById('quizzesContainer').classList.remove('hidden')" class="mt-4 w-full bg-slate-800 py-3 rounded-xl">Back</button>`;
      return;
    }
    const q = quiz.questions[idx];
    player.innerHTML=`<div class="mb-4 text-sm text-slate-400">Q ${idx+1}/${quiz.questions.length}</div><h3 class="font-bold text-lg mb-4">${q.text}</h3><div class="space-y-2">${q.options.map((o,i)=>`<button onclick="answer(${i})" class="w-full text-left bg-slate-800 hover:bg-slate-700 p-3 rounded-xl border border-slate-700">${o}</button>`).join('')}</div>`;
    window.answer = function(i){
      if(i===q.correct) score++;
      idx++; showQ();
    }
  }
  showQ();
}

window.renderAdminPanel = function(){
  const panel = document.getElementById('adminPanel');
  panel.innerHTML = `
    <div class="bg-slate-900 p-6 rounded-xl border border-slate-800 mb-6">
      <h3 class="text-xl font-bold mb-4">Admin Panel</h3>
      <button onclick="openAddModal()" class="w-full bg-purple-600 hover:bg-purple-700 py-3 rounded-xl font-bold mb-3"><i class="fa-solid fa-plus"></i> Add Lesson / Homework / Announcement</button>
      <p class="text-xs text-slate-400">Everything you publish is instantly live on all students phones.</p>
    </div>
    <div class="bg-slate-900 p-6 rounded-xl border border-slate-800">
      <h3 class="text-xl font-bold mb-4"><i class="fa-solid fa-brain text-purple-500"></i> Quiz Creator</h3>
      <div class="grid grid-cols-2 gap-3 mb-4">
        <input id="quizTitle" placeholder="Quiz Title" class="bg-slate-800 text-white p-3 rounded-lg border border-slate-700">
        <select id="quizSubject" class="bg-slate-800 text-white p-3 rounded-lg border border-slate-700"><option>Math</option><option>Science</option><option>English</option><option>History</option><option>General</option></select>
      </div>
      <div id="quizQuestionsList" class="space-y-2 mb-4">${window.currentQuizQuestions.map((q,i)=>`<div class="bg-slate-800 p-3 rounded flex justify-between text-sm">${i+1}. ${q.text}<button onclick="currentQuizQuestions.splice(${i},1);renderCurrentQuestions()" class="text-rose-400 ml-2">x</button></div>`).join('')}</div>
      <div class="bg-slate-800 p-4 rounded-xl border border-dashed border-slate-600 mb-4">
        <input id="qText" placeholder="Question" class="w-full bg-slate-900 p-2 rounded mb-2 border border-slate-700">
        <div class="grid grid-cols-2 gap-2"><input id="qOpt1" placeholder="Option A" class="bg-slate-900 p-2 rounded border border-slate-700"><input id="qOpt2" placeholder="Option B" class="bg-slate-900 p-2 rounded border border-slate-700"><input id="qOpt3" placeholder="Option C" class="bg-slate-900 p-2 rounded border border-slate-700"><input id="qOpt4" placeholder="Option D" class="bg-slate-900 p-2 rounded border border-slate-700"></div>
        <select id="qCorrect" class="w-full mt-2 bg-slate-900 p-2 rounded border border-slate-700"><option value="0">Correct: A</option><option value="1">Correct: B</option><option value="2">Correct: C</option><option value="3">Correct: D</option></select>
        <button onclick="addQuizQuestion()" class="mt-3 w-full bg-blue-600 py-2 rounded-lg">+ Add Question</button>
      </div>
      <button onclick="publishQuiz()" class="w-full bg-purple-600 py-3 rounded-xl font-bold">🚀 Publish Quiz LIVE</button>
      <div id="publishedQuizzesList" class="mt-6 space-y-2">${window.quizzes.map(q=>`<div class="bg-slate-800 p-3 rounded flex justify-between text-sm"><span>${q.title} (${q.questions.length})</span><button onclick="deleteQuiz(${q.id})" class="text-rose-400">Delete</button></div>`).join('')}</div>
    </div>
  `;
}

window.renderCurrentQuestions = function(){
  document.getElementById('quizQuestionsList').innerHTML = window.currentQuizQuestions.map((q,i)=>`<div class="bg-slate-800 p-3 rounded flex justify-between text-sm">${i+1}. ${q.text}<button onclick="currentQuizQuestions.splice(${i},1);renderCurrentQuestions()" class="text-rose-400 ml-2">x</button></div>`).join('');
}
window.addQuizQuestion = function(){
  const text=document.getElementById('qText').value.trim();
  const o1=document.getElementById('qOpt1').value.trim(); const o2=document.getElementById('qOpt2').value.trim();
  const o3=document.getElementById('qOpt3').value.trim(); const o4=document.getElementById('qOpt4').value.trim();
  const correct=parseInt(document.getElementById('qCorrect').value);
  if(!text||!o1||!o2) return alert('Fill question + 2 options');
  window.currentQuizQuestions.push({text, options:[o1,o2,o3,o4].filter(Boolean), correct});
  document.getElementById('qText').value=''; document.getElementById('qOpt1').value=''; document.getElementById('qOpt2').value=''; document.getElementById('qOpt3').value=''; document.getElementById('qOpt4').value='';
  renderCurrentQuestions();
}
window.publishQuiz = async function(){
  const title=document.getElementById('quizTitle').value.trim(); const subject=document.getElementById('quizSubject').value;
  if(!title||window.currentQuizQuestions.length==0) return alert('Add title + question');
  const newQuiz={id:Date.now(), title, subject, questions:[...window.currentQuizQuestions], created:new Date().toISOString()};
  window.quizzes.unshift(newQuiz); localStorage.setItem('quizzes', JSON.stringify(window.quizzes));
  if(window.db){ try{ await setDoc(doc(window.db, "portal", "quizzes"), { data: window.quizzes }); }catch(e){} }
  window.currentQuizQuestions=[]; document.getElementById('quizTitle').value=''; renderAdminPanel(); alert('Quiz LIVE!');
}
window.deleteQuiz = async function(id){
  window.quizzes = window.quizzes.filter(q=>q.id!==id); localStorage.setItem('quizzes', JSON.stringify(window.quizzes));
  if(window.db){ try{ await setDoc(doc(window.db, "portal", "quizzes"), { data: window.quizzes }); }catch(e){} }
  renderAdminPanel(); renderQuizzesForStudents();
}
window.renderAdminQuizzesList = function(){}
</script>

<script>
window.handleAiChat = async function(e) {
    e.preventDefault();
    const inputEl = document.getElementById('aiChatInput');
    const prompt = inputEl.value.trim();
    if (!prompt) return;
    const chatMessages = document.getElementById('aiChatMessages');
    chatMessages.innerHTML += `<div class="flex justify-end"><div class="bg-purple-600 text-white p-3 rounded-2xl rounded-tr-none text-sm">${prompt}</div></div>`;
    inputEl.value='';
    const loadingId = 'loading_' + Date.now();
    chatMessages.innerHTML += `<div id="${loadingId}" class="flex gap-3"><div class="w-8 h-8 bg-purple-600 rounded-full flex items-center justify-center text-white"><i class="fa-solid fa-robot text-xs"></i></div><div class="bg-slate-800 p-3 rounded-2xl rounded-tl-none text-slate-300 animate-pulse text-sm">Thinking...</div></div>`;
    chatMessages.scrollTop = chatMessages.scrollHeight;
    try {
        const apiKey = "AIzaSyDjY7W0lNitZjvwvum59NLvgQGDJPF4FP4";
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
        const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], systemInstruction: { parts: [{ text: "You are a helpful Grade 9C tutor for Smart College Lebanon. Explain clearly, simple, friendly." }] } }) });
        const result = await response.json();
        const reply = result.candidates?.[0]?.content?.parts?.[0]?.text || "Sorry, try again!";
        document.getElementById(loadingId).remove();
        chatMessages.innerHTML += `<div class="flex gap-3"><div class="w-8 h-8 bg-purple-600 rounded-full flex items-center justify-center text-white shrink-0"><i class="fa-solid fa-robot text-xs"></i></div><div class="bg-slate-800 p-3 rounded-2xl rounded-tl-none text-slate-200 text-sm">${reply.replace(/\n/g,'<br>')}</div></div>`;
    } catch (err) {
        document.getElementById(loadingId)?.remove();
        chatMessages.innerHTML += `<div class="flex gap-3"><div class="w-8 h-8 bg-rose-600 rounded-full flex items-center justify-center text-white"><i class="fa-solid fa-triangle-exclamation text-xs"></i></div><div class="bg-slate-800 p-3 rounded-2xl rounded-tl-none text-rose-300 text-sm">Error: ${err.message}</div></div>`;
    }
    chatMessages.scrollTop = chatMessages.scrollHeight;
}
initCloudSync();
renderContent();
if (currentUser) { applyLoginState(); document.getElementById('pinModal').classList.add('hidden'); }
</script>
</body>
</html>
